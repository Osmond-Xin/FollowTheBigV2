name: gate

# 门禁跑在 CI，不跑在提交者机器上（立项讨论 Q9）。main 受保护，PR 是唯一合并路径。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff-cover 需要 merge-base

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: uv sync --group dev

      # Ubuntu 的 7zip 包只给 7z/7za/7zr，没有 7zz；从官方发布页取，版本与 sha256 钉死
      - name: 安装 7zz（摄取测试需要；缺了会被 skip 而不是失败）
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/7zz.tar.xz https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz
          echo "914c7e20ad5ef8e4d3cf08620ff8894b28fe11b7eb99809d6930870fbe48a281  /tmp/7zz.tar.xz" | sha256sum -c -
          sudo tar -xf /tmp/7zz.tar.xz -C /usr/local/bin 7zz
          command -v 7zz && 7zz | head -2

      - name: 门禁（结构 / 依赖方向 / 私有符号 / 词汇 / 行为）
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: bash tools/gate.sh

      - name: 账本门禁（基线版实现；被审 PR 不能给自己当裁判）
        run: |
          git worktree add --detach /tmp/base origin/main
          if [ -f /tmp/base/tools/check_ledger.py ]; then
            PYTHONPATH=/tmp/base/src uv run python /tmp/base/tools/check_ledger.py ledger/defects.toml
          else
            echo "基线（origin/main）尚无账本门禁实现：只有引入它的引导 PR 会走到这里；合并后 main 永远有它"
          fi

      - name: 增量覆盖率（仅纯逻辑核，PR 时）
        if: github.event_name == 'pull_request'
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --include 'src/ftbv2/core/*' \
            --fail-under 90
