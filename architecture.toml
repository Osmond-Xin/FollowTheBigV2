# 模块拓扑声明（工程管束 R5）。「架构图上没有的模块视为不存在」——这份文件就是那张图的机器可读形式；HTML 架构图的模块表由它渲染。
# tools/check_architecture.py（自包含）：src 下每个包 ⊆ 声明；从 depends_on 生成 import-linter 契约并与 setup.cfg 的生成区块比对；
# 跨模块 import 只能从模块顶层包取 __all__ 里的名字；禁 importlib / __import__ / sys.path 篡改。
# 新模块：先在这里登记（含架构图名、归属、依赖），再写代码；否则门禁红。status = implemented | planned：planned 的模块只有名字与依赖，
# src 里不得出现它的包（出现即须先把 status 改为 implemented 并补 package）。

[pure]
forbidden = ["ftbv2.io", "os", "pathlib", "io", "duckdb", "requests"]   # 纯逻辑核不得 import 的东西（polars 表达式允许）

[[module]]
name = "core.raw"
status = "implemented"
package = "ftbv2.core.raw"
kind = "pure"
diagram = "原始层存储与访问（纯核部分：schema 公理 · 类型 · 缺陷账本 · dtype 还原 · 扫描计划）"
depends_on = []

[[module]]
name = "io.receipt"
status = "implemented"
package = "ftbv2.io.receipt"
kind = "io"
diagram = "收据（工程管束 R1：任何入库数字的血缘）"
depends_on = []

[[module]]
name = "io.raw"
status = "implemented"
package = "ftbv2.io.raw"
kind = "io"
diagram = "摄取 · 原始层存储与访问（IO 部分）· 原始层审计"
depends_on = ["core.raw", "io.receipt"]

# ---- 架构图上已定义、尚未实现的模块（package 是预定位置；实现时改 status 并补 __all__）----

