# 缺陷与形状账本（事实单源）。每一条都是登记数据；读取层对未登记的形状硬失败，只看 status = active 的条目。
# 字段：id · code · kind(defect|shape) · stream(省略 = 三个 stream) · days(省略 = 结构性) · status(pending|active|rejected|superseded) ·
#       superseded_by · created_at · evidence(仓库内 ledger/evidence 或 docs 下的文件路径) · evidence_sha256（必填，绑内容）·
#       decision_ref + decision_sha256（形状转 active 必填）· read_layer_action(patch|gap|none) · note（不可改，改叙事 = 新条目）。
# 语义 append-only（tools/check_ledger.py，自包含，CI 另用 main 上那一版再跑）：新增条目只能 pending；禁删 id；
# code/kind/stream/created_at/evidence/evidence_sha256/decision_ref/decision_sha256/note 不可改；days 只许并集；
# 状态只许 pending→active / pending→rejected / active→superseded；废弃只能 superseded_by 指向另一条 active/pending。
# 证据快照放 ledger/evidence/<id>.md（写一次不改）。patch 码必须有读取层处理器（KNOWN_PATCH_CODES）。

