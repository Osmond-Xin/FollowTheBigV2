# 缺陷与形状账本（事实单源）。每一条都是登记数据；读取层对未登记的形状硬失败，只看 status = active 的条目。
# 字段：id · code · kind(defect|shape) · stream(省略 = 三个 stream) · days(省略 = 结构性) · status(pending|active|superseded) ·
#       superseded_by · created_at · evidence(收据 id 或 design-log 引用) · read_layer_action(patch|gap|none) · note。
# 语义 append-only（tools/check_ledger.py）：禁删 id；禁改 code/kind/stream/created_at/evidence；days 只许并集；
# 状态只许 pending→active→superseded；废弃只能 superseded_by 指向已存在 id，原条目保留。日期 ISO。
# 待裁决的形状只能 pending；形状转 active 必须带 decision_ref（裁决出处）；pending 可 rejected（写理由）。patch / gap 必须有 days。
# 状态只许 pending→active / pending→rejected / active→superseded；代码枚举 = active ∪ pending 的 code 集合。收据 id 在收据规则（工程管束 R1）落地前用 design-log 引用。

