# import-linter 契约。依据 docs/design-log/2026-09-01-门禁清单.md §2。
# include_external_packages 必须为 True，否则禁外部包会直接报错退出。

# generated:architecture begin（tools/check_architecture.py --write；手改即红）
[importlinter]
root_package = ftbv2
include_external_packages = True
exclude_type_checking_imports = True

[importlinter:contract:layers]
name = IO 层在上，纯逻辑核在下；核不得反向依赖
type = layers
layers =
    ftbv2.io
    ftbv2.core

[importlinter:contract:core-no-io]
name = 纯逻辑核不得 import IO 层与任何 IO 库
type = forbidden
source_modules =
    ftbv2.core
forbidden_modules =
    ftbv2.io
    os
    pathlib
    io
    duckdb
    requests
allow_indirect_imports = False

[importlinter:contract:module-core.raw]
name = 架构声明：core.raw 只能依赖 []
type = forbidden
source_modules =
    ftbv2.core.raw
forbidden_modules =
    ftbv2.core.book
    ftbv2.core.registry
    ftbv2.io.events
    ftbv2.io.raw
    ftbv2.io.receipt
allow_indirect_imports = False

[importlinter:contract:module-io.receipt]
name = 架构声明：io.receipt 只能依赖 []
type = forbidden
source_modules =
    ftbv2.io.receipt
forbidden_modules =
    ftbv2.core.book
    ftbv2.core.raw
    ftbv2.core.registry
    ftbv2.io.events
    ftbv2.io.raw
allow_indirect_imports = False

[importlinter:contract:module-io.raw]
name = 架构声明：io.raw 只能依赖 ['core.raw', 'io.receipt']
type = forbidden
source_modules =
    ftbv2.io.raw
forbidden_modules =
    ftbv2.core.book
    ftbv2.core.registry
    ftbv2.io.events
allow_indirect_imports = False

[importlinter:contract:module-core.registry]
name = 架构声明：core.registry 只能依赖 ['core.raw']
type = forbidden
source_modules =
    ftbv2.core.registry
forbidden_modules =
    ftbv2.core.book
    ftbv2.io.events
    ftbv2.io.raw
    ftbv2.io.receipt
allow_indirect_imports = False

[importlinter:contract:module-core.book]
name = 架构声明：core.book 只能依赖 ['core.raw']
type = forbidden
source_modules =
    ftbv2.core.book
forbidden_modules =
    ftbv2.core.registry
    ftbv2.io.events
    ftbv2.io.raw
    ftbv2.io.receipt
allow_indirect_imports = False

# generated:architecture end
